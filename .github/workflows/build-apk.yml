name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Preferred: the base64 of blink-release.jks stored as a repository secret.
      # A committed blink-release.jks is also accepted as a fallback.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > blink-release.jks
            echo "Decoded blink-release.jks from the KEYSTORE_BASE64 secret."
          fi
          if [ -f blink-release.jks ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key found (neither KEYSTORE_BASE64 secret nor a committed blink-release.jks) - the release APK will be skipped."
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blink-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
